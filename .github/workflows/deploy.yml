name: Auto Deploy (Safe - Shared Infra)

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cron.yml'
      - '.github/workflows/restore.yml'
      - '.github/workflows/vps-setup.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vietnet
  cancel-in-progress: true

env:
  APP_DIR: /opt/vietnet
  INFRA_DIR: /opt/infra
  INFRA_NGINX_DIR: ${INFRA_DIR}/nginx/conf.d
  DOMAIN: bhquan.store

# ══════════════════════════════════════════════════════
# DEPLOY AN TOÀN CHO SHARED-INFRA (VPS 221.121.1.141)
# Chỉ dựng việtnam-api + vietnet-frontend. Dùng CHUNG
# shared-nginx / shared-mysql / shared-redis từ /opt/infra.
# KHÔNG bao giờ ghi đè nginx.conf, docker-compose infra,
# KHÔNG force-recreate shared-*, KHÔNG GRANT *.*.
# ══════════════════════════════════════════════════════

jobs:
  # ─── 1. TYPE CHECK (parallel) ─────────────────────
  typecheck-fe:
    name: "Typecheck FE"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx tsc --noEmit

  typecheck-be:
    name: "Typecheck BE"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci && npx tsc --noEmit

  # ─── 2. DEPLOY ─────────────────────────────────────
  deploy:
    name: "Deploy VietNet"
    runs-on: ubuntu-latest
    needs: [typecheck-fe, typecheck-be]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT || '22' }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSHPASS=${{ secrets.VPS_PASSWORD }}" >> $GITHUB_ENV

      # ── Sync .env từ GitHub secrets ──────────────
      # NOTE: MYSQL_ROOT_PASSWORD được đọc từ /opt/infra/.env trên VPS,
      # không truyền qua secret (tránh lộ quyền root).
      - name: Sync .env to VPS
        env:
          VIETNET_DB_PASSWORD: ${{ secrets.VIETNET_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT || '22' }}"
          sshpass -e ssh -p $PORT $VPS "mkdir -p ${APP_DIR}"
          cat > /tmp/vietnet.env <<ENVEOF
          NODE_ENV=production
          PORT=4000
          APP_PORT=4000
          DB_HOST=shared-mysql
          DB_PORT=3306
          DB_USERNAME=vietnet
          DB_NAME=vietnet
          REDIS_HOST=shared-redis
          REDIS_PORT=6379
          REDIS_PREFIX=vn:
          APP_URL=https://bhquan.store
          API_URL=https://bhquan.store/api
          ALLOWED_ORIGINS=https://bhquan.store
          FRONTEND_URL=https://bhquan.store
          CORS_ORIGINS=https://bhquan.store
          MAIL_FROM="VietNet <noreply@bhquan.store>"
          ADMIN_EMAIL=admin@bhquan.site
          NEXT_PUBLIC_API_URL=/api
          NEXT_PUBLIC_SITE_URL=https://bhquan.store
          INTERNAL_API_URL=http://vietnet-api:4000/api
          NEXT_REVALIDATE_URL=http://frontend:3000
          ENVEOF
          printf 'DB_PASSWORD=%s\n' "$VIETNET_DB_PASSWORD" >> /tmp/vietnet.env
          printf 'JWT_SECRET=%s\n' "$JWT_SECRET" >> /tmp/vietnet.env
          printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" >> /tmp/vietnet.env
          printf 'REVALIDATE_SECRET=%s\n' "$REVALIDATE_SECRET" >> /tmp/vietnet.env
          printf 'CRON_SECRET=%s\n' "$CRON_SECRET" >> /tmp/vietnet.env
          sshpass -e scp -P $PORT /tmp/vietnet.env $VPS:${APP_DIR}/.env
          sshpass -e ssh -p $PORT $VPS "chmod 600 ${APP_DIR}/.env"
          rm -f /tmp/vietnet.env
          echo ".env synced (secrets không ghi log)"

      # ── Ensure DB user (SCOPED, không *.*) ───────
      - name: Ensure DB + scoped user
        env:
          VIETNET_DB_PASSWORD: ${{ secrets.VIETNET_DB_PASSWORD }}
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT || '22' }}"
          MYSQL_RUNNING=$(sshpass -e ssh -p $PORT $VPS \
            "docker ps --filter name=shared-mysql --filter status=running --format '{{.Names}}'" 2>/dev/null || echo "")
          if [ -z "$MYSQL_RUNNING" ]; then
            echo "::warning::shared-mysql not running — skip DB user setup"
            exit 0
          fi
          printf "CREATE DATABASE IF NOT EXISTS vietnet CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\nCREATE USER IF NOT EXISTS 'vietnet'@'%%' IDENTIFIED BY '%s';\nALTER USER 'vietnet'@'%%' IDENTIFIED BY '%s';\nGRANT ALL PRIVILEGES ON vietnet.* TO 'vietnet'@'%%';\nFLUSH PRIVILEGES;\n" \
            "$VIETNET_DB_PASSWORD" "$VIETNET_DB_PASSWORD" > /tmp/ensure_vietnet.sql
          sshpass -e scp -P $PORT /tmp/ensure_vietnet.sql $VPS:/tmp/ensure_vietnet.sql
          rm -f /tmp/ensure_vietnet.sql
          sshpass -e ssh -p $PORT $VPS "
            docker cp /tmp/ensure_vietnet.sql shared-mysql:/tmp/ensure_vietnet.sql
            docker exec shared-mysql bash -c 'MYSQL_PWD=\"\$MYSQL_ROOT_PASSWORD\" mysql -u root < /tmp/ensure_vietnet.sql' 2>&1
            docker exec shared-mysql rm -f /tmp/ensure_vietnet.sql
            rm -f /tmp/ensure_vietnet.sql
          "

      # ── Ensure DB migrations (nếu có db/changelog) ─
      - name: Ensure DB schema init
        env:
          VIETNET_DB_PASSWORD: ${{ secrets.VIETNET_DB_PASSWORD }}
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT || '22' }}"
          [ ! -d db/schema ] && [ ! -d db/changelog ] && echo "No db folder — skip" && exit 0
          if [ -f db/changelog/_init/001__schema_changelog.sql ]; then
            sshpass -e ssh -p $PORT $VPS "docker exec -i shared-mysql mysql -u vietnet -p$VIETNET_DB_PASSWORD vietnet" < db/changelog/_init/001__schema_changelog.sql 2>/dev/null || true
          fi

      # ── Clone repo nếu chưa có trên VPS ──────────
      - name: Ensure repo present on VPS
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT || '22' }}"
          sshpass -e ssh -p $PORT $VPS "
            if [ ! -d ${APP_DIR}/.git ]; then
              echo '=== Cloning VietNet2026 ==='
              rm -rf ${APP_DIR}
              git clone https://github.com/BHQUAN97/VietNet2026.git ${APP_DIR}
            fi
            cd ${APP_DIR}
            git fetch origin main
            git reset --hard origin/main
          "

      # ── Deploy: networks + build + up ────────────
      - name: Deploy containers (an toàn)
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT || '22' }}"
          sshpass -e ssh -p $PORT $VPS "
            set -e
            export PATH=\$PATH:/usr/local/bin
            echo '=== Deploy VietNet — \$(date) ==='
            cd ${APP_DIR}

            echo '--- Ensure shared networks (idempotent) ---'
            docker network create webphoto_backend 2>/dev/null || true
            docker network create vietnet_frontend 2>/dev/null || true

            echo '--- Attach shared-nginx to vietnet_frontend (nếu chưa) ---'
            docker network connect vietnet_frontend shared-nginx 2>/dev/null || true

            echo '--- Docker build backend + frontend ---'
            docker compose -f docker-compose.prod.yml build backend frontend

            echo '--- Start backend ---'
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --no-deps backend

            echo '--- Wait backend (max 180s) ---'
            HEALTH=false
            for i in \$(seq 1 36); do
              if curl -sf http://localhost:4100/api/health > /dev/null 2>&1; then
                echo \"Backend healthy sau \$((i*5))s\"; HEALTH=true; break
              fi
              [ \$i -eq 36 ] && {
                echo 'ERROR: backend timeout 180s'
                docker logs vietnet-api --tail 60
                docker inspect vietnet-api --format '{{.State.Status}} exit={{.State.ExitCode}}'
                exit 1
              }
              sleep 5
            done

            echo '--- Start frontend ---'
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --no-deps frontend

            echo '--- Nginx: chỉ copy conf.d riêng, không đụng nginx.conf ---'
            cp ${APP_DIR}/nginx/conf.d/bhquan.store.conf ${INFRA_NGINX_DIR}/ 2>/dev/null || true
            docker exec shared-nginx nginx -t && docker exec shared-nginx nginx -s reload
          "

      # ── Health check ─────────────────────────────
      - name: Health check
        run: |
          VPS="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT || '22' }}"
          sleep 5
          echo '--- Backend ---'
          for i in $(seq 1 15); do
            if sshpass -e ssh -p $PORT $VPS "curl -sf http://localhost:4100/api/health > /dev/null 2>&1"; then
              echo "Backend: OK"; break
            fi
            [ $i -eq 15 ] && { echo '::error::Backend health failed'; sshpass -e ssh -p $PORT $VPS "docker logs vietnet-api --tail 20" 2>&1 || true; exit 1; }
            sleep 3
          done
          echo '--- Frontend ---'
          for i in $(seq 1 15); do
            if sshpass -e ssh -p $PORT $VPS "curl -sf http://localhost:3100 > /dev/null 2>&1"; then
              echo "Frontend: OK"; break
            fi
            [ $i -eq 15 ] && { echo '::error::Frontend health failed'; sshpass -e ssh -p $PORT $VPS "docker logs vietnet-frontend --tail 20" 2>&1 || true; exit 1; }
            sleep 4
          done
          echo '--- Container status ---'
          sshpass -e ssh -p $PORT $VPS "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'NAME|vietnet' || true"
          echo '=== Deploy VietNet DONE ==='